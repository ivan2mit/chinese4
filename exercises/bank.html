<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Банк иероглифов — декомпозиция</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./bank.css">
</head>
<body>
  <header class="ed-top">
    <div>
      <p class="ed-eyebrow">ANIMCJK · БАНК ИЕРОГЛИФОВ</p>
      <h1>Декомпозиция на ключи</h1>
    </div>
    <nav id="tabs" class="ed-tabs" role="tablist" aria-label="Раздел"></nav>
  </header>
  <main class="ed-main">
    <p id="status" class="ed-hint" role="status">Загрузка данных…</p>
    <section id="toolbar" class="ed-card bk-toolbar" hidden>
      <div id="filters" class="ed-tabs" role="group" aria-label="Фильтр"></div>
      <input id="search" class="bk-search" type="search" placeholder="Найти: иероглиф, ключ или пиньинь" autocomplete="off" spellcheck="false">
      <span id="count" class="ed-hint"></span>
      <button id="export" class="primary" type="button" disabled>Выгрузить правки (0)</button>
      <button id="reset" type="button" hidden>Сбросить все</button>
    </section>
    <section id="grid" class="bk-grid" hidden></section>
    <section id="keys" class="ed-card" hidden></section>
    <dialog id="detail" class="bk-detail"></dialog>
  </main>
  <script type="module" src="./bank-page.js"></script>
</body>
</html>
